<script>/* Prumo — núcleo de regras (sem DOM). */
(function (root) {
  const Core = {};
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  Core.MESES = MESES;
  const nf = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const nf0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  Core.brl = (v, d0) => (d0 ? nf0 : nf).format(Math.round((v || 0) * 100) / 100 + 0);
  Core.pct = (v, d = 0) => (isFinite(v) ? (v * 100).toFixed(d).replace('.', ',') + '%' : '—');
  Core.dataBR = iso => (iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '');
  Core.hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  Core.r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;

  /* Índices para busca rápida; chamar após qualquer alteração de cadastros */
  Core.reindex = function (db) {
    const c = db.cadastros;
    db._ix = {
      usuarios: new Map(c.usuarios.map(x => [x.id, x])),
      contas: new Map(c.contas.map(x => [x.id, x])),
      classes: new Map(c.classes.map(x => [x.id, x])),
      subclasses: new Map(c.subclasses.map(x => [x.id, x])),
      div: new Map((c.divisaoMensal || []).map(x => [x.mes, x.pctU1]))
    };
    Core.cores(db);
    return db;
  };
  Core.tipoClasse = (db, l) => { const c = db._ix.classes.get(l.classeId); return c ? c.tipo : null; };

  /* Rateio do Grupo: 1) % do lançamento, 2) % do mês, 3) % padrão da configuração */
  Core.pctU1 = function (db, l) {
    if (l.pctU1 != null && l.pctU1 !== '') return Number(l.pctU1);
    const m = db._ix.div.get(l.data.slice(0, 7));
    return m != null ? m : db.config.pctPadraoU1;
  };
  /* Valor atribuído a uma visão: 'todos' | 'U1' | 'U2' */
  Core.atribuido = function (db, l, visao) {
    if (visao === 'todos') return l.valor;
    const u = db._ix.usuarios.get(l.quemId);
    if (!u) return 0;
    if (u.tipo === 'Grupo') { const p = Core.pctU1(db, l); return l.valor * (visao === 'U1' ? p : 1 - p); }
    return u.id === visao ? l.valor : 0;
  };

  /* Seleção: 0/null/[] = tudo; número = só ele; lista = qualquer um deles (filtros de seleção múltipla) */
  Core.emSel = (sel, v) => !sel || (Array.isArray(sel) ? !sel.length || sel.includes(v) : sel === v);
  /* mês único de uma seleção (número, ou lista com um só mês); senão 0 */
  Core.mesUnico = sel => Array.isArray(sel) ? (sel.length === 1 ? sel[0] : 0) : (sel || 0);
  /* Filtro base. f: { ano, mes(0=todos), contaId, visao, incluirPrev, ate (ISO) } */
  Core.passa = function (db, l, f) {
    if (f.ano && l.data.slice(0, 4) !== String(f.ano)) return false;
    if (!Core.emSel(f.mes, +l.data.slice(5, 7))) return false;
    if (!Core.emSel(f.contaId, l.contaId)) return false;
    if (f.incluirPrev === false && l.status === 'Previsto') return false;
    if (f.ate && l.data > f.ate) return false;
    if (f.subOk && !f.subOk(l.subclasseId)) return false;
    return true;
  };

  /* --- lançamentos --- */
  function listaLan() {
    const q = S.lan.q.trim().toLowerCase();
    const f = db().lancamentos.filter(l => {
      if (l.data.slice(0, 4) !== String(S.ano)) return false;
      if (!C.emSel(S.lan.mes, +l.data.slice(5, 7))) return false;
      if (!S.prev && l.status === 'Previsto') return false;
      if (!C.emSel(S.lan.classe, l.classeId)) return false;
      if (!C.emSel(S.lan.conta, l.contaId)) return false;
      if (S.lan.status && l.status !== S.lan.status) return false;
      if (S.visao !== 'todos' && !C.atribuido(db(), l, S.visao)) return false;
      if (q && !(l.descricao + ' ' + C.ident(l) + ' ' + (l.fitid || '')).toLowerCase().includes(q)) return false;
      return true;
    });
    return ordena('lan', f, { data: l => l.data, ident: l => C.ident(l).toLowerCase(), conta: l => cNome(l.contaId), quem: l => uNome(l.quemId), classe: l => klNome(l.classeId) + ' ' + sbNome(l.subclasseId), valor: l => l.valor, parte: l => C.atribuido(db(), l, S.visao), status: l => l.status });
  }

      ${msel('lanmes', 'Todos os meses', C.MESES.map((n, i) => [i + 1, n]))}${msel('lanconta', 'Todas as contas', ordNome(db().cadastros.contas).map(c => [c.id, c.nome]))}${msel('lanclasse', 'Todas as classes', ordNome(db().cadastros.classes).map(c => [c.id, c.nome]))}
      <select data-bind="lanstatus"><option value="">Qualquer status</option><option ${S.lan.status === 'Previsto' ? 'selected' : ''}>Previsto</option><option ${S.lan.status === 'Realizado' ? 'selected' : ''}>Realizado</option></select>
      <button class="btn alt" data-act="lanxlsx" style="margin-left:auto">⤓ Exportar para Excel</button></div>

      ${pg.map(l => `<tr class="row" data-act="edit" data-id="${l.id}" style="cursor:pointer"><td style="white-space:nowrap">${C.dataBR(l.data)}</td><td><div class="ident">${l.parId ? '<span title="Par de transferência" style="opacity:.6">⇄</span> ' : ''}${esc(C.ident(l))}</div>${l.descricao && l.descricao !== C.ident(l) ? `<div class="lbl desc">${esc(l.descricao)}</div>` : ''}</td><td>${aChip(l.contaId)}</td><td>${uChip(l.quemId)}</td><td>${kChip(l.classeId)} <span class="lbl">${esc(sbNome(l.subclasseId))}</span></td><td class="n">${money(l.valor)}</td>${u ? `<td class="n">${money(C.atribuido(db(), l, S.visao))}</td>` : ''}<td><span class="badge ${l.status === 'Previsto' ? 'b-prev' : 'b-real'}">${l.status}</span></td></tr>`).join('') || `<tr><td colspan="8" class="empty">Nenhum lançamento com esses filtros.</td></tr>`}</table></div></div>
      <div class="pager"><button class="btn alt sm" data-act="pag" data-v="-1" ${S.lan.pag ? '' : 'disabled'}>◀</button><span class="lbl">página ${S.lan.pag + 1} de ${pags}</span><button class="btn alt sm" data-act="pag" data-v="1" ${S.lan.pag < pags - 1 ? '' : 'disabled'}>▶</button></div>`;

  function exportarLancamentos() {

  /* --- modal genérico --- */
  function campoHtml(c, v) {
    const val = v == null ? '' : v; const nm = `name="${c.k}"`; const req = c.req ? 'required' : ''; const w = c.w ? 'w' : '';
    let inp;
    if (c.t === 'select') inp = `<select ${nm} ${req}>${c.vazio !== false ? '<option value=""></option>' : ''}${(c.fixa ? c.opts : ordPar(c.opts.map(o => Array.isArray(o) ? o : [o, o]))).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if (c.t === 'multi') inp = `<select multiple size="7" ${nm}>${ordPar(c.opts).map(([ov, ol]) => `<option value="${esc(ov)}" ${(val || []).map(String).includes(String(ov)) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
    else if (c.t === 'area') inp = `<textarea ${nm} rows="2">${esc(val)}</textarea>`;
    else if (c.t === 'money') inp = `<input type="number" step="0.01" ${nm} value="${val}" ${req}>`;
    else if (c.t === 'int') inp = `<input type="number" step="1" ${nm} value="${val}" ${req}>`;
    else if (c.t === 'pct') inp = `<input type="number" step="0.1" min="0" max="100" ${nm} value="${val === '' ? '' : Math.round(val * 1000) / 10}" placeholder="${c.ph || ''}">`;
    else if (c.t === 'date') inp = `<input type="date" ${nm} value="${val}" ${req}>`;
    else if (c.t === 'color') inp = `<input type="color" ${nm} value="${val || '#4C7C69'}">`;
    else if (c.t === 'month') inp = `<input type="month" ${nm} value="${val}" ${req}>`;
    else inp = `<input type="text" ${nm} value="${esc(val)}" ${req} ${c.ro ? 'readonly' : ''} ${c.list ? 'list="' + c.list + '" autocomplete="off"' : ''}>`;
    return `<label class="${w}" data-f="${c.k}">${esc(c.l)}${c.req ? ' *' : ''}${inp}</label>`;
  }
  function modal({ titulo, campos, valores, salvar, excluir, extra, depois }) {
    const d = $('#dlg'); const v = valores || {};
    d.innerHTML = `<form method="dialog"><header>${esc(titulo)}</header><div class="fb">${campos.map(c => campoHtml(c, v[c.k])).join('')}<div class="err" hidden></div></div>
      <footer>${excluir ? '<button type="button" class="btn red" data-m="del" style="margin-right:auto">Excluir</button>' : ''}${extra || ''}<button type="button" class="btn alt" data-m="cancel">Cancelar</button><button type="button" class="btn" data-m="ok">Salvar</button></footer></form>`;
    const lerForm = () => { const o = {}; campos.forEach(c => { const el = d.querySelector(`[name="${c.k}"]`); if (!el) return; if (c.t === 'multi') { o[c.k] = [...el.selectedOptions].map(e => +e.value); return; } let x = el.value; if (c.t === 'money') x = x === '' ? null : parseFloat(x); else if (c.t === 'int') x = x === '' ? null : parseInt(x, 10); else if (c.t === 'pct') x = x === '' ? null : parseFloat(x) / 100; else if (c.t === 'select' && c.num) x = x === '' ? null : +x; else if (c.t === 'text' || c.t === 'area') x = x.trim() || null; else if (x === '') x = null; o[c.k] = x; }); return o; };
    const erro = ms => { const e = $('.err', d); e.hidden = !ms.length; e.innerHTML = ms.map(esc).join('<br>'); };
    d.onclick = async ev => {
      const b = ev.target.closest('[data-m]'); if (!b) return; const a = b.dataset.m;
      if (a === 'cancel') d.close();
      else if (a === 'ok') { const e = salvar(lerForm()); if (e && e.length) erro(e); else { d.close(); } }
      else if (a === 'del') { if (confirm('Excluir definitivamente?')) { const e = excluir(); if (e && e.length) erro(e); else d.close(); } }
      else if (depois && depois.click) depois.click(a, d, lerForm);
    };
    d.showModal(); if (depois && depois.init) depois.init(d, lerForm);
  }

  /* vínculo de par de transferência (parId): saída numa conta + entrada em outra, mesmo valor — ex.: pagamento de fatura */
  function abrirPar(id) {
    const D = db(), l = D.lancamentos.find(x => x.id === id); if (!l) return; const d = $('#dlg');
    const tipoDe = x => C.tipoClasse(D, x), ehT = x => tipoDe(x) === 'Registro' || tipoDe(x) === 'Investimento';
    const dias = (a, b) => Math.abs((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
    const outros = l.parId ? D.lancamentos.filter(x => x.parId === l.parId && x.id !== l.id) : [];
    const cands = l.parId ? [] : D.lancamentos.filter(x => x.id !== l.id && !x.parId && x.contaId !== l.contaId && Math.abs(x.valor + l.valor) <= 0.05 && dias(x.data, l.data) <= 20).sort((a, b) => dias(a.data, l.data) - dias(b.data, l.data)).slice(0, 15);
    const subsReg = ordNome(D.cadastros.subclasses.filter(s => { const k = D._ix.classes.get(s.classeId); return k && k.tipo === 'Registro'; }));
    const lin = x => `<td style="white-space:nowrap">${C.dataBR(x.data)}</td><td>${esc(C.ident(x))}</td><td>${esc(cNome(x.contaId))}</td><td>${x.status}</td><td class="r">${money(x.valor)}</td>`;
    let corpo;
    if (l.parId) corpo = `<div class="lbl" style="margin-bottom:6px">Este lançamento já tem par (parId ${l.parId}).</div><table><tr><th>Data</th><th>Identificação</th><th>Conta</th><th>Status</th><th class="r">Valor</th></tr><tr>${lin(l)}</tr>${outros.map(x => `<tr>${lin(x)}</tr>`).join('') || '<tr><td colspan="5" class="empty">O outro lado do par não foi encontrado.</td></tr>'}</table>`;
    else corpo = cands.length ? `<div class="lbl" style="margin-bottom:6px">Lançamento: ${C.dataBR(l.data)} · ${esc(C.ident(l))} · ${esc(cNome(l.contaId))} · <b>${money(l.valor)}</b>. Escolha o lançamento do outro lado (valor oposto, outra conta, até 20 dias de diferença, sem par):</div>
      <table><tr><th></th><th>Data</th><th>Identificação</th><th>Conta</th><th>Status</th><th class="r">Valor</th></tr>${cands.map((x, i) => `<tr><td><input type="radio" name="parcand" value="${x.id}" ${i === 0 ? 'checked' : ''}></td>${lin(x)}</tr>`).join('')}</table>
      <label style="display:block;margin-top:10px">Classificar os dois como (transferência não é receita nem despesa)<select name="parsub"><option value="">Manter a classificação atual</option>${subsReg.map(s => `<option value="${s.id}">${esc(klNome(s.classeId))} › ${esc(s.nome)}</option>`).join('')}</select></label><div class="lbl" id="parav"></div>`
      : '<div class="empty">Nenhum candidato: procurei lançamentos de valor oposto (±R$ 0,05), em outra conta, a até 20 dias, ainda sem par. Confira se o outro lado foi lançado (e com o mesmo valor).</div>';
    d.innerHTML = `<form method="dialog"><header>⇄ Par de transferência — lançamento #${l.id}</header><div class="fb"><div class="scroll">${corpo}</div></div><footer>${l.parId ? '<button type="button" class="btn red" data-p="desv" style="margin-right:auto">Desvincular par</button>' : ''}<button type="button" class="btn alt" data-p="x">Fechar</button>${cands.length ? '<button type="button" class="btn" data-p="ok">Vincular</button>' : ''}</footer></form>`;
    const sel = d.querySelector('[name=parsub]'), aviso = d.querySelector('#parav');
    const sugere = () => { if (!sel) return; const r = d.querySelector('[name=parcand]:checked'), x = r && D.lancamentos.find(z => z.id === +r.value); const ambos = x && ehT(l) && ehT(x); if (ambos) sel.value = ''; else if (subsReg.length && !sel.dataset.tocou) sel.value = subsReg[0].id; aviso.textContent = ambos ? '' : (subsReg.length ? 'Algum lado não é de classe de transferência (Registro): sugerida a classificação acima; troque se preferir.' : 'Algum lado não é de classe Registro e não há subclasse Registro cadastrada: o lado de despesa continuará contando como despesa.'); };
    if (sel) { sel.onchange = () => { sel.dataset.tocou = 1; }; d.onchange = ev => { if (ev.target.name === 'parcand') sugere(); }; sugere(); }
    const salvarAnos = (...ls) => ls.forEach(z => sujar('lan:' + z.data.slice(0, 4)));
    d.onclick = ev => {
      const b = ev.target.closest('[data-p]'); if (!b) return; const a = b.dataset.p;
      if (a === 'x') d.close();
      else if (a === 'desv') { delete l.parId; if (outros.length === 1) delete outros[0].parId; salvarAnos(l, ...outros); d.close(); render(); toast('Par desvinculado'); }
      else if (a === 'ok') {
        const r = d.querySelector('[name=parcand]:checked'); if (!r) return; const x = D.lancamentos.find(z => z.id === +r.value); if (!x) return;
        const pid = Math.min(l.id, x.id); l.parId = pid; x.parId = pid;
        const sid = +sel.value, s = sid && D.cadastros.subclasses.find(z => z.id === sid); if (s) [l, x].forEach(z => { z.classeId = s.classeId; z.subclasseId = s.id; });
        salvarAnos(l, x); d.close(); render(); toast('Par vinculado' + (s ? ' e classificado como ' + s.nome : ''));
      }
    };
    d.showModal();
  }

  const TIPOS_CONTA = ['Conta corrente', 'Conta salário', 'Dinheiro', 'Conta investimento', 'Crédito', 'Vale Alimentação'];
  function abrirLan(id) {

    const campos = () => [
      { k: 'data', l: 'Data', t: 'date', req: 1 }, { k: 'status', l: 'Status', t: 'select', opts: ['Realizado', 'Previsto'], vazio: false },

  /* --- cadastros --- */
  const usuariosInd = () => db().cadastros.usuarios.filter(u => u.tipo === 'Individual').map(u => [u.id, u.nome]);
  const refs = { contas: l => db().lancamentos.filter(x => x.contaId === l.id).length, classes: l => db().lancamentos.filter(x => x.classeId === l.id).length + db().cadastros.subclasses.filter(s => s.classeId === l.id).length, subclasses: l => db().lancamentos.filter(x => x.subclasseId === l.id).length };

  function cadEditar(id) {
    const cd = CAD[S.cad]; const novo = id == null; const r = novo ? cd.novo() : cd.lista().find(x => String(x.id) === String(id)); if (!r) return;
    const lista = db().cadastros[S.cad];
    modal({ titulo: (novo ? 'Novo — ' : 'Editar — ') + cd.nome, campos: cd.campos(r), valores: r,
      excluir: (novo || cd.nodelete) ? null : () => { const n = cd.ref(r); if (n) return ['Há ' + n + ' registro(s) usando este item. Reatribua ou use Status "Inativo".']; lista.splice(lista.indexOf(r), 1); C.reindex(db()); sujar('cadastros'); render(); return []; },
      salvar: o => {
        const e = []; const n = { ...r, ...o };
        if (S.cad === 'contas' && lista.some(x => x.id !== r.id && x.nome.toLowerCase() === (n.nome || '').toLowerCase())) e.push('Já existe uma conta com esse nome.');

      } });

  /* rosca SVG; itens: [{id,nome,valor,pct,cor,agrup}]; clicavel: data-act detClasse */
  function svgRosca(itens, clicavel, paleta, tt) {
    if (!itens.length) return '<div class="lbl" style="padding:30px;text-align:center">Sem despesas no período.</div>';
    const R = 80, r = 48, cx = 100, cy = 100; let a0 = -Math.PI / 2, fat = '';
    const pt = (R_, a) => [cx + R_ * Math.cos(a), cy + R_ * Math.sin(a)];
    itens.forEach((it, i) => {
      const cor = it.cor || (paleta && paleta[it.nome]) || DT_FALLBACK[i % DT_FALLBACK.length], tit = `<title>${esc(it.nome)}: ${C.brl(it.valor, true)} (${dtPct(it.pct)})</title>`;
      const att = (clicavel && !it.agrup ? ` data-act="detClasse" data-v="${it.id}" style="cursor:pointer"` : '') + ttAttr(tt, it);
      if (it.pct >= 0.9999) { fat += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${cor}" stroke-width="${R - r}"${att}>${tit}</circle>`; return; }
      const a1 = a0 + it.pct * 2 * Math.PI, big = it.pct > 0.5 ? 1 : 0, [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
      fat += `<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z" fill="${cor}" stroke="#fff" stroke-width="1"${att}>${tit}</path>`; a0 = a1;
    });
    return `<svg viewBox="0 0 200 200" width="100%" style="max-width:210px">${fat}</svg>`;
  }

      return `<div class="dt-li"${att}><i style="background:${cor}"></i><span>${esc(it.nome)}${it.agrup ? ` <span class="lbl">(${it.qtd})</span>` : ''}</span><b>${dtPct(it.pct)}</b><span class="n lbl">${C.brl(it.valor, true)}</span></div>`; }).join('')}</div>`;
  }
  /* tooltip dos lançamentos: tt = 'K' | 'S' (classe/subclasse) | 'R' | 'N' (recorrência/necessidade); 'Outras' lista as fatias agrupadas */
  const ttAttr = (tt, it) => !tt ? '' : it.agrup ? ` data-tt="O|${it.ids.join(',')}|Despesa|${tt}" data-ctx="det"` : ` data-tt="${tt}|${it.id}|Despesa" data-ctx="det"`;
  const cartaoRosca = (titulo, g, clicavel, paleta, extra, tt) => `<div class="card"><h3>${titulo}</h3><div class="body dt-rosca">${svgRosca(g.itens, clicavel, paleta, tt)}${legendaRosca(g.itens, clicavel, paleta, tt)}</div>${extra || ''}</div>`;

  const dtVar = v => v == null ? '<span class="lbl">—</span>' : `<span class="${v > 0.0005 ? 'neg' : v < -0.0005 ? 'pos' : ''}">${v > 0 ? '▲' : v < 0 ? '▼' : ''} ${(Math.abs(v) * 100).toFixed(0)}%</span>`;

  VIEWS.det = function () {
    const f = filtro({ mes: S.mes, contaId: 0 });
    let r = Dt.calcular(db(), Object.assign({}, f, { classeId: S.det.classe }));
    if (S.det.classe && !r.sel) { S.det.classe = 0; r = Dt.calcular(db(), Object.assign({}, f, { classeId: 0 })); }
    const sel = r.sel, ano = !S.mes.length, varios = S.mes.length > 1, anteriorTxt = varios ? 'período anterior' : ano ? String(r.anterior.ano) : cap(C.MESES[r.anterior.mes - 1].slice(0, 3)) + '/' + String(r.anterior.ano).slice(2);
    const chips = chipsMes('detmes', S.mes);
    const periodo = ano ? S.ano : (varios ? mesesTxt(S.mes) : cap(C.MESES[S.mes[0] - 1])) + '/' + S.ano;
    const voltar = sel ? `<div class="tools"><button class="btn" data-act="detVoltar">← Todas as classes</button> <span class="lbl">Detalhando <b>${esc(sel.nome)}</b> — a rosca principal mostra as subclasses; Recorrência e Necessidade consideram só esta classe.</span></div>` : '';
    const kpis = `<div class="grid g4">${kpi('Despesas — ' + periodo, sel ? sel.valor : r.total, sel ? esc(sel.nome) + ' · ' + dtPct(r.total > 0 ? sel.valor / r.total : 0) + ' do total' : 'todas as classes', false).replace('class="v "', 'class="v neg"')}${kpi('Período anterior (' + anteriorTxt + ')', sel ? sel.anterior : r.totalAnterior, '', false)}${ano && r.meses ? kpi('Média por mês', C.r2((sel ? sel.valor : r.total) / r.meses), 'em ' + r.meses + ' mês(es) com despesa', false) : ''}</div>`;
    const aviso = r.reembolsos < 0 ? nota('Reembolsos abatidos das despesas: ' + C.brl(-r.reembolsos, true) + '. As roscas mostram só os valores positivos; a tabela traz o líquido.') : '';
    const principal = cartaoRosca(sel ? 'Despesas por Subclasse — ' + esc(sel.nome) : 'Despesas por Classe', r.principal, !sel, null, `<div class="lbl" style="padding:0 12px 8px">Fatias abaixo de 3% ficam em “Outras”${sel ? '' : '. Clique numa classe para detalhar.'}</div>`, sel ? 'S' : 'K');
    /* tabela hierárquica */
    const acc = { nome: x => x.nome, valor: x => x.valor, pct: x => x.valor, media: x => x.media, variacao: x => x.variacao };
    const classes = ordena('det', sel ? [sel] : r.classes, acc);
    const tot = sel ? sel.valor : r.total;
    const linhas = classes.map(c => {
      const k = 'det:' + c.classeId, aberta = !!sel || S.aberto.has(k), cs = db()._ix.classes.get(c.classeId) || {};
      const cab = `<tr class="row" style="background:var(--soft);font-weight:700;cursor:pointer" data-act="tog" data-k="${k}" data-tt="K|${c.classeId}|Despesa" data-ctx="det"><td>${aberta ? '▾' : '▸'} <span class="aura" style="background:${esc(cs.cor || '#8AA6B1')};display:inline-block;width:10px;height:10px;border-radius:3px"></span> ${esc(c.nome)}</td><td class="n">${C.brl(c.valor, true)}</td><td class="n">${dtPct(tot > 0 ? c.valor / tot : 0)}</td>${ano ? `<td class="n">${c.media == null ? '' : C.brl(c.media, true)}</td>` : ''}<td class="n">${dtVar(c.variacao)}</td></tr>`;
      const subs = aberta ? ordena('det', c.subs, acc).map(s => `<tr class="row" data-tt="S|${s.subclasseId}|Despesa" data-ctx="det"><td style="padding-left:30px">${esc(s.nome)} <span class="lbl">${esc([s.necessidade, s.recorrencia].filter(x => x !== Dt.NI).join(' · '))}</span></td><td class="n">${C.brl(s.valor, true)}</td><td class="n">${dtPct(tot > 0 ? s.valor / tot : 0)}</td>${ano ? `<td class="n">${s.media == null ? '' : C.brl(s.media, true)}</td>` : ''}<td class="n">${dtVar(s.variacao)}</td></tr>`).join('') : '';
      return cab + subs;
    }).join('');
    const tabela = `<div class="card"><h3>Despesas no período${sel ? ' — ' + esc(sel.nome) : ''}</h3><div class="scroll"><table><tr>${th('det', 'nome', 'Classe / Subclasse')}${th('det', 'valor', 'Valor', 'n')}${th('det', 'pct', '% do total', 'n')}${ano ? th('det', 'media', 'Média/mês', 'n') : ''}${th('det', 'variacao', 'Var. vs ' + anteriorTxt, 'n')}</tr>${linhas || '<tr><td colspan="5" class="lbl">Sem despesas no período.</td></tr>'}<tr class="tot"><td>Total</td><td class="n">${C.brl(tot, true)}</td><td class="n">${tot > 0 ? '100%' : ''}</td>${ano ? `<td class="n">${r.meses && tot ? C.brl(C.r2(tot / r.meses), true) : ''}</td>` : ''}<td class="n">${dtVar(sel ? sel.variacao : (r.totalAnterior > 0 ? (r.total - r.totalAnterior) / r.totalAnterior : null))}</td></tr></table></div></div>`;
    return `<h1>Detalhamento de despesas — ${periodo}</h1>${chips}${voltar}${kpis}${aviso}
      <div class="dt-grid" style="margin-top:12px"><div class="dt-esq">${principal}<div class="grid g2" style="margin-top:12px">${cartaoRosca('Despesas por Recorrência', r.recorrencia, false, DT_PAL.recorrencia, '', 'R')}${cartaoRosca('Despesas por Necessidade', r.necessidade, false, DT_PAL.necessidade, '', 'N')}</div></div><div class="dt-dir">${tabela}</div></div>`;
  };
  window.Prumo = { S, render, abrirDir, iniciar, VIEWS, atualizarDaPasta, persistir };
  window.addEventListener('DOMContentLoaded', async () => { render(); S.lembrada = St.suportaPasta() ? await St.lembrada() : null; const cp = await St.copiaLer(); S.copiaEm = cp ? cp.em : null; if ((S.lembrada || S.copiaEm) && !db()) render(); });
})();
</script><script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script></body></html>
